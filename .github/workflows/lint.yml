name: Lint

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  phpcs:
    name: PHP (WordPress Coding Standards)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check PHP syntax
        run: find themes mu-plugins -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run PHPCS
        run: composer lint

      - name: Validate JSON files
        run: |
          for f in themes/skylar-park/theme.json .wp-env.json package.json composer.json; do
            php -r 'json_decode(file_get_contents($argv[1]), false, 512, JSON_THROW_ON_ERROR);' "$f" && echo "OK $f"
          done
